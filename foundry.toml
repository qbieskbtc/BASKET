[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[invariant]
runs = 512
depth = 64
fail_on_revert = false
